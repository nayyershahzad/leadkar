# LeadKar — Docker Compose (Phase 0 stubs)
#
# Service definitions are scaffolded here but the `backend`/`frontend` builds will
# NOT succeed until Phase 1 adds backend/Dockerfile, frontend/Dockerfile, and app
# code. `postgres` and `redis` are functional now.
#
# Shared-host adaptations (see README + CLAUDE.md §11):
#   - postgres/redis are docker-internal only (no published host ports).
#   - backend/frontend publish on 127.0.0.1 at BACKEND_HOST_PORT/FRONTEND_HOST_PORT
#     (default 8001/3001) so the existing HOST nginx can reverse-proxy them.
#   - No nginx service here; host nginx terminates TLS and proxies leadkar.pk.

name: leadkar

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - leadkar_pgdata:/var/lib/postgresql/data
    networks:
      - leadkar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port published — reach it via `docker compose exec postgres psql`.
    # To debug from the host, uncomment (5432/5433 are taken, so use 5434):
    # ports:
    #   - "127.0.0.1:5434:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - leadkar_redisdata:/data
    networks:
      - leadkar
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port published (6379/6380/6381 are taken). Debug via:
    # ports:
    #   - "127.0.0.1:6382:6379"

  # --- The services below are Phase 1 stubs; build contexts don't exist yet. ---

  backend:
    # Phase 1: build from ./backend (python:3.11-slim).
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - leadkar
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8001}:8000"
    profiles: ["app"]   # excluded from default `up` until Phase 1

  worker:
    # Phase 1: same image as backend, runs `celery -A app.tasks.celery_app worker`.
    build:
      context: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info"]
    env_file: .env
    depends_on:
      - backend
    networks:
      - leadkar
    profiles: ["app"]

  beat:
    # Phase 1: Celery beat for reconciliation + quarterly catalog refresh.
    build:
      context: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    env_file: .env
    depends_on:
      - backend
    networks:
      - leadkar
    profiles: ["app"]

  frontend:
    # Phase 6: build from ./frontend (Next.js 14).
    build:
      context: ./frontend
    restart: unless-stopped
    env_file: .env
    networks:
      - leadkar
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3001}:3000"
    profiles: ["app"]

volumes:
  leadkar_pgdata:
  leadkar_redisdata:

networks:
  leadkar:
    driver: bridge
