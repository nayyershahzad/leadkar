# LeadKar — Docker Compose (Phase 1: infra & database)
#
# Shared-host adaptations (see README + CLAUDE.md §11):
#   - postgres/redis are docker-internal only (no published host ports).
#   - backend/frontend publish on 127.0.0.1 at BACKEND_HOST_PORT/FRONTEND_HOST_PORT
#     (default 8001/3001) so the existing HOST nginx can reverse-proxy them.
#   - No nginx service here; host nginx terminates TLS and proxies leadkar.pk.
#
# backend, worker, and beat share the same image built from ./backend.
# frontend remains a Phase 6 stub behind the "frontend" profile.

name: leadkar

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - leadkar_pgdata:/var/lib/postgresql/data
    networks:
      - leadkar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # To debug from the host, uncomment (5432/5433 are taken, so use 5434):
    # ports:
    #   - "127.0.0.1:5434:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - leadkar_redisdata:/data
    networks:
      - leadkar
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ports:
    #   - "127.0.0.1:6382:6379"

  backend:
    image: leadkar-backend
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - leadkar
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8001}:8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: leadkar-backend
    build:
      context: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info"]
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - leadkar
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*worker' > /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  beat:
    image: leadkar-backend
    build:
      context: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - leadkar
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    # Phase 6: build from ./frontend (Next.js 14). Stubbed until then.
    build:
      context: ./frontend
    restart: unless-stopped
    env_file: .env
    networks:
      - leadkar
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3001}:3000"
    profiles: ["frontend"]

volumes:
  leadkar_pgdata:
  leadkar_redisdata:

networks:
  leadkar:
    driver: bridge
