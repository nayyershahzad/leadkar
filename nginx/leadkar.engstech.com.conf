# LeadKar — host nginx server block for leadkar.engstech.com.
#
# HTTP-only on purpose: `certbot --nginx` reads this, obtains the cert, then
# injects the TLS (443) server block + HTTP->HTTPS redirect automatically.
#
# Install on the VPS host nginx (shared box — adds a vhost, doesn't touch others):
#   sudo cp nginx/leadkar.engstech.com.conf /etc/nginx/sites-available/   (or /etc/nginx/conf.d/)
#   sudo ln -s /etc/nginx/sites-available/leadkar.engstech.com.conf /etc/nginx/sites-enabled/   # if sites-* layout
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d leadkar.engstech.com      # provisions TLS + redirect
#
# Routes /api/* -> FastAPI backend (127.0.0.1:8002), everything else -> Next.js
# frontend (127.0.0.1:3002).

upstream leadkar_be { server 127.0.0.1:8002; }
upstream leadkar_fe { server 127.0.0.1:3002; }

server {
    server_name leadkar.engstech.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://leadkar_be;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://leadkar_fe;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://leadkar_fe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/leadkar.engstech.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/leadkar.engstech.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = leadkar.engstech.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name leadkar.engstech.com;
    return 404; # managed by Certbot


}