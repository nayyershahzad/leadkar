# LeadKar — host nginx server block (CLAUDE.md §9 Phase 8).
#
# Install on the VPS host nginx (NOT a container), e.g.:
#   sudo cp nginx/leadkar.conf /etc/nginx/sites-available/leadkar.conf
#   sudo ln -s /etc/nginx/sites-available/leadkar.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d leadkar.pk -d www.leadkar.pk   # provisions TLS
#   sudo nginx -t && sudo systemctl reload nginx
#
# Routing: /api/* -> FastAPI backend (127.0.0.1:8002), everything else -> Next.js
# frontend (127.0.0.1:3002). These are the shared-host ports (CLAUDE.md §11).

upstream leadkar_backend  { server 127.0.0.1:8002; }
upstream leadkar_frontend { server 127.0.0.1:3002; }

# HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name leadkar.pk www.leadkar.pk;
    # certbot writes the ACME challenge location here; keep this above the redirect.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name leadkar.pk www.leadkar.pk;

    # Managed by certbot (paths created by `certbot --nginx`):
    ssl_certificate     /etc/letsencrypt/live/leadkar.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leadkar.pk/privkey.pem;

    # Security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    client_max_body_size 5m;

    # API -> FastAPI backend. The PayPro callback posts here too.
    location /api/ {
        proxy_pass http://leadkar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Next.js immutable build assets — cache hard.
    location /_next/static/ {
        proxy_pass http://leadkar_frontend;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else -> Next.js frontend.
    location / {
        proxy_pass http://leadkar_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
