# LeadKar — public S3 endpoint (MinIO) for presigned download links.
#
# Install on the host nginx, then issue TLS:
#   sudo cp nginx/s3.leadkar.engstech.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/s3.leadkar.engstech.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d s3.leadkar.engstech.com
#
# Proxies to MinIO on 127.0.0.1:9000. Host header MUST be preserved — presigned
# URLs are signed against s3.leadkar.engstech.com, and MinIO re-validates the
# signature using the incoming Host.

server {
    listen 80;
    listen [::]:80;
    server_name s3.leadkar.engstech.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
